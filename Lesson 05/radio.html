<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms 2</title>
    <style>
      fieldset {
        width: 200px;
        margin-block: 10px;
      }
    </style>
  </head>
  <body>
    <form>
      <label for="ism">Your name</label>
      <input type="text" id="ism" />

      <fieldset>
        <legend>Gender</legend>

        <div>
          <input type="radio" name="gender" id="erkak" />
          <label for="erkak">Male</label>
        </div>

        <div>
          <input type="radio" name="gender" id="ayol" />
          <label for="ayol">Female</label>
        </div>
      </fieldset>

      <fieldset>
        <legend>Favorite subjects</legend>

        <div>
          <input type="checkbox" name="fan" id="fizika" />
          <label for="fizika">Physics</label>
        </div>

        <div>
          <input type="checkbox" name="fan" id="it" checked disabled />
          <label for="it">IT</label>
        </div>

        <div>
          <input type="checkbox" name="fan" id="matematika" />
          <label for="matematika">Maths</label>
        </div>

        <div>
          <input type="checkbox" name="fan" id="tarix" />
          <label for="tarix">History</label>
        </div>
      </fieldset>
    </form>
  </body>
</html>
